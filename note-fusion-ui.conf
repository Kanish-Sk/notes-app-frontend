## HTTP -> HTTPS redirect + ACME challenge
server {
    listen 80;
    server_name note-fusion.forgebase.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

## HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name note-fusion.forgebase.duckdns.org;

    ssl_certificate     /etc/nginx/ssl/forgebase.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/forgebase.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    client_max_body_size 2G;

    access_log /var/log/nginx/notes_fusion_access.log;
    error_log  /var/log/nginx/notes_fusion_error.log;

    root /usr/share/nginx/html/note-fusion-ui;
    index index.html;

    # Frontend static assets — long cache (Vite fingerprints filenames)
    location ~* \.(?:css|js|svg|woff2?|ttf|eot|ico|png|jpe?g|gif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Never cache index.html so a new deploy is picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Backend API — routed through the backend nginx vhost, not the container directly
    location /api/ {
        proxy_pass https://note-fusion-00-backend.forgebase.duckdns.org/;
        proxy_http_version 1.1;
        proxy_set_header Host note-fusion-00-backend.forgebase.duckdns.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket / SSE support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;

        proxy_ssl_server_name on;
    }

    # React Router SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}